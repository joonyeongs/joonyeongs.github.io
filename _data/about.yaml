about:
  text: "Hello! I’m Junyoung Sung. I am currently working as an undergraduate researcher at <a href=\"https://alinlab.kaist.ac.kr/\" target=\"_blank\">ALIN Lab</a>, <a href=\"https://www.kaist.ac.kr/\" target=\"_blank\">KAIST</a>, advised by <a href=\"https://alinlab.kaist.ac.kr/shin.html\" target=\"_blank\">Prof. Jinwoo Shin</a>. Previously, I have done my research internship at <a href=\"https://miil.korea.ac.kr/\" target=\"_blank\">MIIL</a>, <a href=\"https://www.korea.edu/\" target=\"_blank\">Korea University</a>, advised by <a href=\"https://phseo.github.io/\" target=\"_blank\">Prof. Paul Hongsuck Seo</a>. My research focuses on robotic foundation models that can generalize effectively to diverse and dynamic real-world situations. Recently, I have been particularly interested in data-centric approaches to robot learning, including synthetic data generation and leveraging large-scale human video data to address the scarcity of robot interaction data."
