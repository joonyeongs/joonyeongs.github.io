about:
  text: "Hello! I’m Junyoung Sung. I am currently an undergraduate student at <a href=\"https://www.korea.edu/\" target=\"_blank\">Korea University</a> and a research intern at <a href=\"https://alinlab.kaist.ac.kr/\" target=\"_blank\">ALIN Lab</a>, <a href=\"https://www.kaist.ac.kr/\" target=\"_blank\">KAIST</a>, advised by <a href=\"https://alinlab.kaist.ac.kr/shin.html\" target=\"_blank\">Prof. Jinwoo Shin</a>. Previously, I was a research intern at <a href=\"https://miil.korea.ac.kr/\" target=\"_blank\">MIIL</a>, Korea University, advised by <a href=\"https://phseo.github.io/\" target=\"_blank\">Prof. Paul Hongsuck Seo</a>. My research interests lie in Vision–Language–Action (VLA) models and world models. I am currently focusing on latent actions that unify human and robot data, as well as synthetic data generation for VLAs."
